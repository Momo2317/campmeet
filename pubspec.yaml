name: camp_meet
description: A student-exclusive dating app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.10+1
  flutter_riverpod: ^3.3.1
  cached_network_image: ^3.3.1
  flutter_card_swiper: ^7.2.0
  image_picker: ^1.0.7
  video_player: ^2.8.6
  record: ^6.2.0
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  encrypt: ^5.0.3
  screen_protector: ^1.3.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.1
  in_app_purchase: ^3.3.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  flutter_image_compress: ^2.5.1
  liquid_glass_renderer: ^1.0.0-dev.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/AppIcon_1024.png"
  adaptive_icon_background: "assets/Android_Adaptive/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/Android_Adaptive/ic_launcher_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/